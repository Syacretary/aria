include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "custom_lint/**"
    - "build/**"
    - android/**
    - ios/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
    analysis_options_deprecated_plugins: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - unawaited_futures
    - directives_ordering
    - sort_child_properties_last
    - require_trailing_commas

custom_lint:
  rules:
    - no_raw_bottom_sheet
    - no_raw_gesture_tap
    - prefer_aria_duration
