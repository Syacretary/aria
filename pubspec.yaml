name: aria
description: "ARIA — AI companion that guards your digital habits."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^3.5.0

  # Routing
  go_router: ^18.1.3

  # Persistence
  shared_preferences: ^2.5.3

  # Typography: Plus Jakarta Sans is vendored under assets/fonts/ (OFL 1.1),
  # so no runtime font package is needed.
  # Formatting
  intl: ^0.20.2
  collection: ^1.19.1

  # Immutable models + JSON (DTO layer)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.15
  freezed: ^3.2.0
  json_serializable: ^6.11.0

  custom_lint: ^0.8.0
  aria_lint:
    path: custom_lint/aria_lint

# shared_preferences_android 2.5.x currently decodes Android values through its
# JNI interop codec; legacy preference values can make its getAll decoder throw
# before the app's first screen is built. Keep the compatible Pigeon channel
# implementation until that migration handles every legacy value type.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true

  assets:
    - assets/permissions/

  # Plus Jakarta Sans is vendored rather than fetched at runtime. A companion
  # app should render its first frame identically on a plane as on wifi, and
  # bundled fonts also make golden tests deterministic.
  # Licensed under the SIL Open Font License 1.1 — see
  # assets/fonts/PlusJakartaSans-LICENSE.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
